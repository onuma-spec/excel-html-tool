<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>R7年度実施 事務事業評価</title>
<style>
  :root{
    --bg:#f7f5f0; --card:#ffffff; --ink:#2b2b28; --sub:#54514a;
    --line:#c9c4b4; --accent:#3d6b52; --accent-bg:#e9f2ec;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:"Yu Gothic","Hiragino Sans","Meiryo",sans-serif;}
  .wrap{max-width:1200px; margin:0 auto; padding:24px 16px 80px;}
  h1{font-size:1.3rem; margin:0 0 6px;}
  p.lead{color:var(--sub); font-size:.88rem; margin:0 0 6px; line-height:1.6; white-space:pre-wrap;}
  p.viewer-meta{color:var(--sub); font-size:.76rem; margin:0 0 18px;}
  button{
    font-family:inherit; font-size:.85rem; padding:8px 14px; border-radius:6px; border:1px solid var(--accent);
    background:var(--accent); color:#fff; cursor:pointer;
  }
  button.secondary{background:#fff; color:var(--accent);}
  button:disabled{opacity:.5; cursor:not-allowed;}
  .hint{font-size:.76rem; color:var(--sub); margin-top:6px;}
  .detail-back-hint{display:inline-block; margin:0 0 0 10px; vertical-align:middle;}
  .ai-note{font-size:.72rem; color:var(--sub); margin-top:18px; opacity:.85;}
  .action-bar{display:flex; gap:10px; align-items:center; margin:8px 0 16px; flex-wrap:wrap;}

  #viewer-search-bar{display:flex; gap:10px; align-items:center; margin:10px 0; flex-wrap:wrap;}
  #viewer-keyword{flex:1 1 240px; padding:8px 10px; border:1px solid var(--line); border-radius:6px; font-size:.85rem; font-family:inherit;}
  #viewer-only-checked-label, #viewer-show-memo-label{display:flex; align-items:center; gap:6px; font-size:.82rem; white-space:nowrap;}
  .viewer-memo-text-cell{white-space:pre-wrap; max-width:260px;}

  #viewer-col-toggle{display:flex; flex-wrap:wrap; gap:6px 14px; margin:10px 0; padding:8px 10px; background:var(--card); border:1px solid var(--line); border-radius:6px; font-size:.78rem;}
  #viewer-col-toggle label{display:flex; align-items:center; gap:4px; cursor:pointer; white-space:nowrap;}
  #viewer-summary{
    display:flex; flex-wrap:wrap; gap:8px 22px; align-items:baseline; margin:12px 0;
    background:var(--accent-bg); border:1px solid var(--accent); border-radius:8px; padding:10px 16px;
  }
  .summary-item{display:flex; align-items:baseline; gap:6px; white-space:nowrap;}
  .summary-label{font-size:.78rem; color:var(--sub);}
  .summary-value{font-size:1.15rem; font-weight:bold; color:var(--accent);}

  #viewer-table-root{overflow-x:auto;}
  table.viewer-table{border-collapse:collapse; width:100%; font-size:.8rem; background:var(--card);}
  table.viewer-table th, table.viewer-table td{border:1px solid var(--line); padding:6px 8px; text-align:left; vertical-align:top;}
  table.viewer-table th{background:#eeeae0; white-space:nowrap;}
  .sort-btn{background:none; border:none; color:var(--ink); padding:0; font-size:.8rem; font-weight:bold; cursor:pointer;}
  .col-filter{display:inline-block; font-weight:normal;}
  .col-filter summary{cursor:pointer; list-style:none; display:inline-block; padding:0 2px;}
  .col-filter summary::-webkit-details-marker{display:none;}
  .col-filter-panel{
    z-index:10; min-width:140px; max-height:220px;
    overflow:auto; background:#fff; border:1px solid var(--line); border-radius:4px; padding:6px 8px;
    box-shadow:0 2px 6px rgba(0,0,0,.15); font-size:.76rem;
  }
  .col-filter-panel label{display:flex; align-items:center; gap:4px; white-space:nowrap; padding:2px 0; cursor:pointer;}
  .memo-popover{display:inline-block;}
  .memo-popover summary{cursor:pointer; list-style:none; font-size:.85rem;}
  .memo-popover summary::-webkit-details-marker{display:none;}
  .memo-panel{
    z-index:10; width:240px; background:#fff; border:1px solid var(--line); border-radius:6px; padding:8px;
    box-shadow:0 2px 6px rgba(0,0,0,.15);
  }
  .memo-panel textarea{width:100%; min-height:80px; font-family:inherit; font-size:.8rem; box-sizing:border-box; padding:6px; border:1px solid var(--line); border-radius:4px;}
  .viewer-chk-cell{white-space:nowrap;}

  #detail-summary-bar{
    position:sticky; top:0; z-index:5; background:var(--accent-bg); border:1px solid var(--line); border-radius:8px;
    padding:12px 14px; margin-bottom:14px; display:flex; flex-wrap:wrap; gap:12px 20px; align-items:flex-start;
  }
  .detail-field{display:flex; flex-direction:column; font-size:.8rem;}
  .detail-field .k{color:var(--sub); font-size:.72rem;}
  .detail-field .v{font-weight:bold;}
  .detail-check-label{display:flex; align-items:center; gap:6px; font-size:.82rem;}
  #detail-memo{width:260px; min-height:44px; font-family:inherit; font-size:.8rem; padding:6px; border:1px solid var(--line); border-radius:6px; box-sizing:border-box;}
  #detail-nav{display:flex; gap:10px; margin:10px 0;}

  #detail-body-root{overflow-x:auto; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:8px;}
  table.excel-grid{border-collapse:collapse; table-layout:fixed;}
  table.excel-grid td{border:1px solid #b9b2a0; padding:0; vertical-align:middle; overflow:hidden; position:relative;}
  th.ruler-col, th.ruler-row-num, th.ruler-corner{
    background:#dcd8cc; border:1px solid #b9b2a0; font-size:.7rem; font-weight:normal; color:#5a564a;
    text-align:center; padding:2px; position:sticky; z-index:3;
  }
  th.ruler-col, th.ruler-corner{top:0;}
  th.ruler-row-num, th.ruler-corner{left:0;}
  th.ruler-corner{z-index:4;}
  td.cell-label{background:#eeeae0; padding:3px 6px; font-size:.78rem; font-weight:bold; color:#333;}
  td.cell-label span{display:block; white-space:pre-wrap; word-break:break-all;}
  td.cell-calc{background:#f2e6ce; padding:3px 20px 3px 6px; font-size:.78rem; text-align:right; color:#7a5a20;}
  td.cell-blocked{background:#f2f1ec;}
  td.cell-input{background:#fff;}
  td.cell-input input, td.cell-input textarea, td.cell-input select{
    width:100%; height:100%; border:none; padding:3px 6px; font-size:.8rem; font-family:inherit;
    background:transparent; resize:none; color:var(--ink);
  }

  #viewer-scratch-root{display:none;}
  #viewer-print-root{display:none;}
  .bulk-print-record{margin-bottom:24px;}
  .bulk-print-record h2, .bulk-print-record h3{font-size:1rem; margin:0 0 8px;}
  table.viewer-print-list-table{border-collapse:collapse; width:100%; font-size:.76rem;}
  table.viewer-print-list-table th, table.viewer-print-list-table td{border:1px solid #999; padding:4px 8px; text-align:left; vertical-align:top; white-space:pre-wrap;}
  table.viewer-print-list-table th{background:#eeeae0; font-weight:bold;}
  table.viewer-print-list-table td.viewer-print-chk{text-align:center;}

  table.print-grid{border-collapse:collapse; table-layout:fixed; width:100%;}
  table.print-grid td{
    border:1px solid #999; padding:1px 6px; vertical-align:top;
    font-size:.72rem; line-height:1.25; white-space:pre-wrap; overflow-wrap:anywhere;
    -webkit-print-color-adjust:exact; print-color-adjust:exact;
  }
  table.print-grid td.print-cell-label{background:#eeeae0; font-weight:bold;}
  table.print-grid td.print-cell-calc{text-align:right; background:#f2e6ce;}
  table.print-grid td.print-cell-blocked{background:#f2f1ec;}
  table.print-grid td.print-cell-input{background:#fff;}

  @page{margin:10mm;}
  @media print{
    .no-print{display:none !important;}
    body{background:#fff;}
    .wrap{max-width:none; padding:0; margin:0;}
    body.bulk-printing .wrap > *:not(#viewer-print-root){display:none !important;}
    body.bulk-printing #viewer-print-root{display:block;}
    .bulk-print-record{page-break-after:always;}
    .bulk-print-record:last-child{page-break-after:auto;}
  }
</style>
</head>
<body>
<div class="wrap">
  <h1 id="viewer-title" class="no-print"></h1>
  <p class="lead no-print" id="viewer-description"></p>
  <p class="viewer-meta no-print"><span id="viewer-source"></span><span id="viewer-updated"></span></p>

  <div id="list-root">
    <div id="viewer-search-bar" class="no-print">
      <input type="text" id="viewer-keyword" placeholder="キーワードで検索">
      <label id="viewer-only-checked-label" for="viewer-only-checked"><input type="checkbox" id="viewer-only-checked">気になる事業だけ表示</label>
      <label id="viewer-show-memo-label" for="viewer-show-memo"><input type="checkbox" id="viewer-show-memo">メモを表示</label>
    </div>
    <div id="viewer-col-toggle" class="no-print"></div>
    <div id="viewer-summary" class="no-print"></div>
    <div id="viewer-table-root"></div>

    <div class="action-bar no-print">
      <button class="secondary" id="btn-print-checked">🖨 表示中の事業を印刷</button>
      <button class="secondary" id="btn-export-backup">💾 ☑・メモをバックアップ（JSON）</button>
      <button class="secondary" onclick="document.getElementById('backup-file-input').click()">📂 バックアップを読み込む</button>
      <input type="file" id="backup-file-input" accept="application/json" style="display:none">
    </div>
    <p class="hint no-print">現在の検索・絞り込み結果をまとめて印刷します。☑を付けた事業だけを印刷したい場合は、「気になる事業だけ表示」で絞り込んでからこのボタンを押してください。</p>
    <p class="hint no-print">☑・メモはこの端末のブラウザにのみ保存されます（送信は行いません）。機種変更等に備えてバックアップをご利用ください。</p>
  </div>

  <div id="detail-root" style="display:none">
    <button class="secondary no-print" id="btn-back-to-list">← 一覧に戻る</button>
    <span class="hint no-print detail-back-hint">☑・メモは一覧に戻っても保持されます（この端末にのみ保存）。</span>
    <div id="detail-nav" class="no-print">
      <button class="secondary" id="detail-prev">← 前へ</button>
      <button class="secondary" id="detail-next">次へ →</button>
      <button class="secondary" id="btn-print-detail">🖨 この事業を印刷</button>
    </div>
    <div id="detail-summary-bar" class="no-print"></div>
    <div id="detail-body-root"></div>
  </div>

  <p class="ai-note no-print">このページは、市が公表した一次資料に基づき、Claude（AI）を用いて作成しています。</p>
</div>

<div id="viewer-print-root"></div>
<div id="viewer-scratch-root"></div>

<script>
// 事務事業評価データ公表支援ツール ①②のコア処理（ブラウザ・Node両方で動く共通ロジック）
// 前提：ロック状態・データ入力規則は読めない（SheetJS無料版の制約、ユーザー承認済み）。
// 「値の有無」「結合セル」「数式かどうか（cell.f）」だけで構造を判定する簡易版。

(function (root, factory) {
  if (typeof module === 'object' && module.exports) {
    module.exports = factory();
  } else {
    root.CoreLogic = factory();
  }
})(typeof self !== 'undefined' ? self : this, function () {

// ---------------------------------------------------------------------------
// 1. 結合セルを解決した論理グリッドを作る
// ---------------------------------------------------------------------------

function colLetterToNum(letters) {
  let n = 0;
  for (const ch of letters) n = n * 26 + (ch.charCodeAt(0) - 64);
  return n;
}

function parseRef(ref) {
  const m = ref.match(/^([A-Z]+)(\d+)$/);
  return { col: colLetterToNum(m[1]), row: parseInt(m[2], 10) };
}

function buildGrid(ws) {
  const ref = ws['!ref'];
  const range = XLSXUtilsDecodeRange(ref);
  const merges = ws['!merges'] || [];

  // (row,col) -> アンカー(row0,col0,row1,col1)
  const anchorOf = new Map();
  for (const m of merges) {
    const r0 = m.s.r + 1, c0 = m.s.c + 1, r1 = m.e.r + 1, c1 = m.e.c + 1;
    for (let r = r0; r <= r1; r++) {
      for (let c = c0; c <= c1; c++) {
        anchorOf.set(r + ',' + c, [r0, c0, r1, c1]);
      }
    }
  }

  const grid = new Map();
  const infoCache = new Map();
  for (let r = range.s.r + 1; r <= range.e.r + 1; r++) {
    for (let c = range.s.c + 1; c <= range.e.c + 1; c++) {
      const key = r + ',' + c;
      const anchor = anchorOf.get(key);
      const ar = anchor ? anchor[0] : r;
      const ac = anchor ? anchor[1] : c;
      const ar2 = anchor ? anchor[2] : r;
      const ac2 = anchor ? anchor[3] : c;
      const infoKey = ar + ',' + ac;
      if (!infoCache.has(infoKey)) {
        const addr = colNumToLetter(ac) + ar;
        const cell = ws[addr];
        const isFormula = !!(cell && cell.f);
        const value = isFormula ? '' : (cell && cell.v !== undefined ? cell.v : '');
        const formula = isFormula ? ('=' + cell.f) : '';
        const hasFill = !!(cell && cell.s && cell.s.patternType);
        const fillColor = (hasFill && cell.s.fgColor && cell.s.fgColor.rgb) ? cell.s.fgColor.rgb : null;
        infoCache.set(infoKey, {
          row: ar, col: ac, row2: ar2, col2: ac2,
          value, isFormula, formula, hasFill, fillColor,
          renderType: null, renderOptions: null,
          // 項目名マッピング（B）：JSON出力時のキー名を「col11」等の自動名から
          // 任意の名前に差し替える。未設定はnull（自動名のまま）。
          dbKey: null,
          // 手直しで「見出しの文字を空欄」に設定した結果としてのみtrueになる。
          // 入力不可の空白セル（余白・仕切り）として描画され、構造上も
          // 通常の空欄入力欄と同じ扱い（hasText=false）だが編集はできない。
          blocked: false,
          hasText: (typeof value === 'string' && value.trim() !== '') ||
                    (typeof value === 'number' && !isFormula),
        });
      }
      grid.set(key, infoCache.get(infoKey));
    }
  }
  return { grid, maxRow: range.e.r + 1, maxCol: range.e.c + 1 };
}

/**
 * 手直し（見出し⇔入力欄の切替・型指定・プルダウン・数式編集）をgridに適用する。
 * override = { kind: 'label'|'textarea'|'number'|'currency'|'select'|'formula',
 *              label, options, formula }
 * gridを直接書き換えるので、この後にsplitSections/buildSectionObjectを呼べば
 * 手直し後の構造がそのままJSON出力にも反映される（描画と書き出しで二重管理しない）。
 */
function applyOverrides(grid, overridesById, cellIdFn) {
  for (const info of new Set(grid.values())) {
    const ov = overridesById[cellIdFn(info)];
    if (!ov) continue;
    // 項目名マッピング（B）：セルの種類とは独立した設定なので、種類の分岐に関係なく
    // 常に反映する（未設定はnull＝JSON出力は従来通り自動名「col11」等のまま）。
    info.dbKey = ov.dbKey || null;
    if (ov.kind === 'label') {
      const text = String(ov.label || '').trim();
      if (text) {
        info.hasText = true;
        info.isFormula = false;
        info.value = ov.label;
        info.blocked = false;
      } else {
        // 見出しの文字を空欄にした場合：入力不可の空白セル（余白・仕切り）にする。
        // hasTextはfalseのまま（＝JSONの項目名にもセクション見出しにもならない）。
        info.hasText = false;
        info.isFormula = false;
        info.blocked = true;
      }
    } else if (ov.kind === 'formula') {
      info.isFormula = true;
      info.hasText = false;
      info.blocked = false;
      info.formula = ov.formula || info.formula;
    } else {
      info.hasText = false;
      info.isFormula = false;
      info.blocked = false;
      info.renderType = ov.kind;
      info.renderOptions = ov.options || null;
    }
  }
}

/**
 * 書き出し済みの入力フォームHTMLから取り出したSTRUCTURE（serializeStructureの出力）を、
 * buildGridと同じ形のgrid Mapに復元する。手直し結果（renderType/blocked/formula等）は
 * すでにcellsに焼き込み済みなのでそのまま使い、この上にさらに新しいOVERRIDESを重ねられる。
 */
function buildGridFromCells(cells, maxRow, maxCol) {
  const grid = new Map();
  cells.forEach(c => {
    const info = {
      row: c.row, col: c.col, row2: c.row2, col2: c.col2,
      value: c.value, isFormula: !!c.isFormula, formula: c.formula || '',
      hasFill: !!c.fillColor, fillColor: c.fillColor || null,
      renderType: c.renderType || null, renderOptions: c.renderOptions || null,
      dbKey: c.dbKey || null,
      blocked: !!c.blocked, hasText: !!c.hasText,
    };
    for (let r = c.row; r <= c.row2; r++) {
      for (let cc = c.col; cc <= c.col2; cc++) {
        grid.set(r + ',' + cc, info);
      }
    }
  });
  return { grid, maxRow, maxCol };
}

function colNumToLetter(n) {
  let s = '';
  while (n > 0) {
    const rem = (n - 1) % 26;
    s = String.fromCharCode(65 + rem) + s;
    n = Math.floor((n - 1) / 26);
  }
  return s;
}

function XLSXUtilsDecodeRange(ref) {
  const [a, b] = ref.split(':');
  const pa = parseRef(a), pb = parseRef(b || a);
  return { s: { r: pa.row - 1, c: pa.col - 1 }, e: { r: pb.row - 1, c: pb.col - 1 } };
}

// ---------------------------------------------------------------------------
// 2. セクション分割：1列目だけに値があり他の列が空の行を「見出し行」とみなす
//    （ロック状態やフォントに頼らず、値の配置パターンだけで判定する簡易版）
// ---------------------------------------------------------------------------

function splitSections(grid, maxRow, maxCol) {
  const markers = [];
  const seen = new Set();
  for (let r = 1; r <= maxRow; r++) {
    const a1 = grid.get(r + ',1');
    if (!a1 || a1.row !== r || !a1.hasText) continue;
    // 複数行にまたがる縦結合（「R6年度」等の外側グループラベル）は見出し行ではない。
    // 見出し行は1行だけの短いラベル（例：Do／Check）という前提を置く。
    if (a1.row2 !== a1.row) continue;
    // 「他の列が空欄」だけでは、空欄テンプレートでは普通のラベル行
    // （例：事業の目的＋空欄の入力欄）と区別がつかない。塗りつぶし色の有無を
    // 追加の判定材料にする（このツールの前提：見出し行だけ無地、ラベル行は
    // 塗りつぶしあり。SheetJSはロック状態は読めないが塗りつぶし色は読める）。
    if (a1.hasFill) continue;
    // 塗りつぶしなし・単独行・値ありという条件だけで見出し行と判定する
    // （「他の列が空欄」という追加条件は、見出し行と同じ行にたまたま入っている
    // 補足メモ（「（単位：千円）」等）1つで簡単に崩れるため、あえて課さない）。
    if (!seen.has(r)) {
      seen.add(r);
      markers.push({ row: r, title: String(a1.value) });
    }
  }
  if (markers.length === 0) {
    return [{ title: 'シート', row0: 1, row1: maxRow }];
  }
  const sections = [];
  markers.forEach((m, i) => {
    const row1 = i + 1 < markers.length ? markers[i + 1].row - 1 : maxRow;
    sections.push({ title: m.title, row0: m.row + 1, row1 });
  });
  return sections;
}

// ---------------------------------------------------------------------------
// 3. 行ユニット化＋構造の入れ子JSON化（ラベル→値、グループ→子リストを再帰的に組み立てる）
// ---------------------------------------------------------------------------

function rowSpanOf(grid, r, maxCol) {
  // 1列目（外側グループラベル列になりやすい）を除外し、2列目以降の結合状況だけで
  // その行の実質的な高さを求める（PDF/Excel版の試作で得た教訓を踏襲）。
  let row2 = r;
  for (let c = 2; c <= maxCol; c++) {
    const info = grid.get(r + ',' + c);
    if (info && info.row === r) row2 = Math.max(row2, info.row2);
  }
  return row2;
}

function firstCellOfRow(grid, r0, maxCol, fromCol) {
  for (let c = fromCol; c <= maxCol; c++) {
    const info = grid.get(r0 + ',' + c);
    if (info && info.row === r0) return info;
  }
  return null;
}

function cellsOfRow(grid, r0, maxCol, fromCol) {
  const out = [];
  const seen = new Set();
  for (let c = fromCol; c <= maxCol; c++) {
    const info = grid.get(r0 + ',' + c);
    if (!info || info.row !== r0) continue;
    const key = info.row + ',' + info.col;
    if (seen.has(key)) continue;
    seen.add(key);
    out.push(info);
  }
  return out;
}

function buildUnits(grid, row0, row1, maxCol) {
  const units = [];
  let r = row0;
  while (r <= row1) {
    const r2 = rowSpanOf(grid, r, maxCol);
    units.push([r, r2]);
    r = r2 + 1;
  }
  return units;
}

/**
 * セクション本文（row0〜row1）を、入れ子のJSONオブジェクトに変換する。
 * - 手動グループ（人が🗂ボタンで明示的に宣言した行範囲）があれば、その範囲の
 *   子ユニット群をまとめる（子が全て無名＝配列、子に個別ラベルあり＝辞書）。
 *   グループ化はこの手動宣言だけが起点で、Excelのタテ結合の有無からは自動検出しない
 *   （タテ結合は見出し行とデータ行を区別できないため）。
 * - それ以外の単発ユニットは「1列目のラベル → 2列目以降の値（複数あれば辞書）」として扱う。
 * - 数式セル（合計行等）は除外する。
 */
function cellId(info) {
  return 'cell_R' + info.row + '_C' + info.col;
}

// getValue(info) は「このセルの値をどこから読むか」を差し替え可能にする。
// 省略時はテンプレート自身の値（プレビュー用）。フォーム入力後の書き出し時は
// 対応するDOM要素（input/textarea、id=cellId(info)）から読む関数を渡す。
function defaultGetValue(info) {
  return info.hasText ? info.value : '';
}

// 手動グループ化（A）：ある行(u0)がユーザーが明示的に宣言したグループの開始行かどうかを返す。
// {row0,row1,name} の配列から、row0が一致するものを探す（1範囲=1グループの前提）。
function findManualGroup(manualGroups, u0) {
  return (manualGroups || []).find(g => g.row0 === u0) || null;
}

// 自動検出（縦結合）：ユニット(u0,u1)が「1列目に複数ユニットにまたがる縦結合ラベルを
// 持つグループの先頭」かどうかを判定する。buildSectionObject（書き出し）・
// renderGrid（グリッド描画時のハイライト）の両方から同じ条件で呼べるよう共通化する。
function isAutoGroupStart(groupInfo, u0, u1) {
  return !!(groupInfo && groupInfo.row === u0 && groupInfo.row2 > u1 && groupInfo.hasText);
}

// 行rowが、自動検出グループ（縦結合）の範囲内に含まれているかどうかを判定して返す
// （UIが「この選択範囲は自動グループ化を解除できます」を出すかどうかの判定に使う）。
// 先頭行（縦結合のアンカー行）である必要はない。1列目のセルはExcelの結合により
// アンカー行のCellInfoをそのまま指しているため、rowがどこであってもgrid.get(row+',1')は
// アンカー行の情報を返す（buildGridのanchorOf解決による）。これは自動グループが
// 現在disabledかどうかにも左右されない、Excel自体の構造だけを見た判定である。
// 該当しなければnull。該当すればラベル名・自動検出としての範囲（row0〜row1）を返す。
function getAutoGroupRange(grid, maxCol, row) {
  const groupInfo = grid.get(row + ',1');
  if (!groupInfo || !groupInfo.hasText) return null;
  const anchorRow = groupInfo.row;
  const u1 = rowSpanOf(grid, anchorRow, maxCol);
  if (!isAutoGroupStart(groupInfo, anchorRow, u1)) return null;
  return { row0: anchorRow, row1: groupInfo.row2, label: String(groupInfo.value).replace(/\s+/g, '') };
}

// グリッド全体のうち、自動検出（縦結合）によってグループの一部とみなされる行番号の集合を返す。
// 手動グループが同じ範囲を明示的に宣言している場合はそちらが優先されるため、その分は除く
// （buildSectionObjectの優先順位・打ち切りロジックとズレると、実際には手動グループとして
// 出力される行が自動グループの色で表示される、といった見た目と実体の食い違いが起きる）。
function computeAutoGroupRows(grid, sections, maxCol, manualGroups) {
  const rows = new Set();
  for (const sec of sections) {
    const units = buildUnits(grid, sec.row0, sec.row1, maxCol);
    let i = 0;
    while (i < units.length) {
      const [u0, u1] = units[i];
      const manualGroup = findManualGroup(manualGroups, u0);
      if (manualGroup && manualGroup.disabled) {
        // 自動グループ化を解除した範囲：グループではないので色も付けない。このユニットだけ
        // スキップして次へ（buildSectionObjectの解除ブランチと同じ単位で進める）。
        i++;
        continue;
      }
      if (manualGroup) {
        let j = i;
        while (j < units.length && units[j][0] <= manualGroup.row1) j++;
        i = j;
        continue;
      }
      const groupInfo = grid.get(u0 + ',1');
      if (isAutoGroupStart(groupInfo, u0, u1)) {
        let groupEndRow = groupInfo.row2;
        const overlappingManual = (manualGroups || [])
          .filter(g => g.row0 > u0 && g.row0 <= groupEndRow)
          .sort((a, b) => a.row0 - b.row0)[0];
        if (overlappingManual) groupEndRow = overlappingManual.row0 - 1;
        let j = i;
        while (j < units.length && units[j][0] <= groupEndRow) {
          for (let r = units[j][0]; r <= units[j][1]; r++) rows.add(r);
          j++;
        }
        i = j;
        continue;
      }
      i++;
    }
  }
  return rows;
}

// グループの子ユニット群（buildRowEntryの結果配列）を、JSON出力用の辞書または配列に
// まとめる。まず実データを持たない子（hasRealData=false。見出し行の残骸）を除外する。
// 残った子が全員ラベル付きなら辞書（groupValue）にする。
// 無名の繰り返し行と「その他」のような名前付きの単発行が混在する場合、無名の子だけを
// 配列（groupValue）にし、名前付きの子はグループの外側で通常の単発行として扱えるよう
// extraEntriesで返す（配列に混ぜると要素の形がバラバラになり、ラベルの情報も失われる
// ため。以前はここで名前付きの子を捨てておりデータが消えていた）。
//
// opts.requireMultiple（自動検出グループ専用。手動グループでは使わない）：
// 「全員ラベル付きなら辞書」の判定に、子が2件以上あることを追加で要求する。
// 自動検出グループは、手動グループに範囲を奪われて残りが1件だけになることがあり
// （既知の不具合として報告・修正済み）、その1件がたまたまラベル付きだと
// 「見出し由来の残骸1件だけの辞書」が生成されてしまっていた。手動グループなしで
// 縦結合そのものが検出される場合は必ず2ユニット以上あるため（isAutoGroupStartが
// row2>u1を要求する）、requireMultipleをtrueにしても正常なケースには影響しない。
// 一方、手動グループ（人が明示的に1行だけを選んで宣言する運用が正当にある。
// 例：備考欄1行をメモ欄として辞書化する）ではrequireMultipleを立てないことで、
// 1件だけの辞書化を引き続き許容する。
function groupChildrenToResult(children, opts) {
  const minCount = (opts && opts.requireMultiple) ? 1 : 0;
  const real = children.filter(c => c.hasRealData);
  if (real.length > minCount && real.every(c => c.label)) {
    const dict = {};
    real.forEach(c => { dict[c.label] = c.value; });
    return { groupValue: dict, extraEntries: [] };
  }
  const unlabeled = real.filter(c => !c.label);
  const labeled = real.filter(c => c.label);
  return { groupValue: unlabeled.map(c => c.value), extraEntries: labeled };
}

// collector（省略可）：値セルが実際に使う項目名を、そのセル（CellInfo）と一緒に
// 記録したい場合に配列を渡す（findMappingTargets専用）。渡すと、defaultKeyFor()による
// 自動命名（colN）が使われたセルの{cell, rowLabel, groupLabel}がここに積まれる。
// 通常のJSON書き出し（collector省略）には一切影響しない。
function buildSectionObject(grid, row0, row1, maxCol, getValue, manualGroups, collector) {
  getValue = getValue || defaultGetValue;
  const units = buildUnits(grid, row0, row1, maxCol);
  const result = {};
  let i = 0;
  while (i < units.length) {
    const [u0, u1] = units[i];

    // 手動グループ（A）：Excelの縦結合の有無に頼らず、人が明示的に「この範囲は
    // 親ラベル＋子レコードの配列」と宣言したもの。自動検出（縦結合ラベル）より優先する。
    // 子行は1列目もそのまま値として扱う（縦結合ラベルのように1列目を消費しないため fromCol=1）。
    const manualGroup = findManualGroup(manualGroups, u0);
    // 自動グループ化の解除（disabled:true）：この行から始まる自動検出グループを
    // 「グループ化しない」と明示的に宣言したもの。グループとしてはまとめず、
    // このユニット1つだけ通常の単発行として処理し、次のユニットへ進む
    // （後続のユニットはそもそもisAutoGroupStartの対象外なので、ここで1回スキップ
    // すれば十分。自動検出の判定自体には手を加えない）。
    if (manualGroup && manualGroup.disabled) {
      const entry = buildRowEntry(grid, u0, u1, maxCol, 1, getValue, collector, null);
      if (entry.label) result[entry.label] = entry.value;
      i++;
      continue;
    }
    if (manualGroup) {
      const groupEndRow = manualGroup.row1;
      const childUnits = [];
      let j = i;
      while (j < units.length && units[j][0] <= groupEndRow) { childUnits.push(units[j]); j++; }

      const children = childUnits.map(([cu0, cu1]) => buildRowEntry(grid, cu0, cu1, maxCol, 1, getValue, collector, manualGroup.name));
      const { groupValue, extraEntries } = groupChildrenToResult(children);
      result[manualGroup.name] = groupValue;
      // 配列に混ぜられなかった名前付きの子（「その他」等）は、グループの外側で
      // 通常の単発行として出力する（データを失わないため）。
      extraEntries.forEach(e => { result[e.label] = e.value; });
      i = j;
      continue;
    }

    // 自動検出（縦結合）：1列目に複数ユニットにまたがる縦結合ラベル（例：「R6年度」
    // 「成果指標」）があれば、そのラベルをキーに子ユニット群を自動的にまとめる。
    // 手動グループより後に判定するので、同じ範囲を手動グループで明示的に宣言すれば
    // そちらが優先される。
    const groupInfo = grid.get(u0 + ',1');
    if (isAutoGroupStart(groupInfo, u0, u1)) {
      let groupEndRow = groupInfo.row2;
      // 自動検出の範囲内から手動グループが開始している場合、そのままでは自動グループが
      // 手動グループの行まで丸ごと飲み込んでしまい、手動グループ側のu0が一生ループに
      // 現れない（このifブロックがjを一気に進めてしまうため）。手動グループの開始行の
      // 手前で自動グループを打ち切り、後続のループで手動グループ側のu0を正しく迎える。
      const overlappingManual = (manualGroups || [])
        .filter(g => g.row0 > u0 && g.row0 <= groupEndRow)
        .sort((a, b) => a.row0 - b.row0)[0];
      if (overlappingManual) groupEndRow = overlappingManual.row0 - 1;

      const childUnits = [];
      let j = i;
      while (j < units.length && units[j][0] <= groupEndRow) { childUnits.push(units[j]); j++; }

      const key = String(groupInfo.value).replace(/\s+/g, '');
      const children = childUnits.map(([cu0, cu1]) => buildRowEntry(grid, cu0, cu1, maxCol, 2, getValue, collector, key));
      // requireMultiple:true — 自動検出グループが手動グループに範囲を奪われて1件だけ
      // 残った場合に、その1件を辞書化せずextraEntries（グループ外の独立キー）へ回す
      // ための指定（groupChildrenToResultのコメント参照。既知バグの修正）。
      const { groupValue, extraEntries } = groupChildrenToResult(children, { requireMultiple: true });
      result[key] = groupValue;
      extraEntries.forEach(e => { result[e.label] = e.value; });
      i = j;
      continue;
    }

    const entry = buildRowEntry(grid, u0, u1, maxCol, 1, getValue, collector, null);
    if (entry.label) {
      result[entry.label] = entry.value;
    }
    // ラベルなしの単発行（グループにも属さない）は、見出しどうしの間の余白行など
    // 意味を持たない行であることがほとんどのため、トップレベルには出力しない
    // （グループ内の無名行は上の自動検出／手動グループの分岐で別途、配列として正しく保持される）。
    i++;
  }
  return result;
}

// 値セルの既定キー名を求める：①明示的なdbKeyが最優先、②なければ同じ行内で直前に
// 現れた見出しセルの文字（「事業類型」「区分」のように、行の途中に埋め込まれた
// 見出しをそのまま項目名として使う）、③どちらもなければ従来通りcolN。
// core_logic.js（書き出し）・grid_render.js（読込）の両方で同じ規則を使う必要があるため
// 共有関数として切り出す（対称実装が崩れるとデータ消失・混線の原因になるという既存の教訓）。
function defaultKeyFor(c, precedingLabel) {
  return c.dbKey || precedingLabel || ('col' + c.col);
}

/**
 * 1つの行ユニットを {label, value, hasRealData} に変換する。
 * fromCol=1のときは1列目自体をラベル候補とする。fromCol=2のときは
 * （呼び出し元がすでにグループラベルとして1列目を消費済みなので）2列目から見る。
 * hasRealData：この行に実際の入力欄（空欄セル）が1つでも含まれるかどうか。
 * 「判定／判定理由」のような、値側もラベルしか持たない見出し行（グループの先頭に
 * 混ざりやすい）を、繰り返しグループの処理側でレコードから除外するために使う。
 */
// collector/context：findMappingTargets専用（buildSectionObjectのコメント参照）。
// context には、この行が属するグループのキー名（無ければnull）を渡す。
// dbKey設定済みかどうかに関わらず収集する（findMappingTargets側で「未設定のみ」
// 「設定済みも含めて全部」を判断する）。
function buildRowEntry(grid, u0, u1, maxCol, fromCol, getValue, collector, context) {
  getValue = getValue || defaultGetValue;
  const cells = cellsOfRow(grid, u0, maxCol, fromCol).filter(c => !c.isFormula);
  if (cells.length === 0) return { label: null, value: null, hasRealData: false };

  const first = cells[0];
  if (first.hasText) {
    // 先頭セルがラベル。残りのセルを値として集める。
    const rowLabel = String(first.value).replace(/\s+/g, '');
    const rest = cells.slice(1);
    if (rest.length === 0) return { label: null, value: null, hasRealData: false };
    if (rest.length === 1) {
      const valueCell = rest[0];
      if (valueCell.hasText) {
        // rest[0]自体がラベル（＝先頭セルに続けてもう1つラベルが並ぶだけの見出し行）
        // なら、実データは無い。名前を選ぶ余地もないためcollectorには積まない。
        return { label: rowLabel, value: getValue(valueCell), hasRealData: false };
      }
      // 「1行1見出し1値」：JSONキーは行見出し文字がそのまま既定名になり曖昧さがないため、
      // 当初はSTEP3の項目名マッピング・STEP4の各種ピッカーどちらにも出さない設計だった。
      // しかしこのパターンの行だけで構成された様式では選択肢が0件になってしまうため、
      // 他のセルと同様にcollectorへ積んで選択・改名の対象にする
      // （dbKeyで改名されればそちらを出力キーとして優先する）。
      const autoName = rowLabel;
      if (collector && !valueCell.blocked) collector.push({ cell: valueCell, rowLabel, groupLabel: context || null, autoName });
      return { label: valueCell.dbKey || rowLabel, value: getValue(valueCell), hasRealData: true };
    }
    const dict = {};
    let precedingLabel = null;
    let hasRealData = false;
    rest.forEach((c) => {
      // 行の途中に埋め込まれた見出しセル（例：「事業類型」「区分」）は、それ自体は
      // 値として出力せず、直後の1個の値セルの既定の項目名として使う。次の値セルからは
      // 新しい見出しに出会うまでcolNにフォールバックする（見出しが使い回されて複数の
      // 値セルが同じキーになり、片方が上書きで消える事故を防ぐ）。
      if (c.hasText) { precedingLabel = String(c.value).replace(/\s+/g, ''); return; }
      hasRealData = true;
      const key = defaultKeyFor(c, precedingLabel);
      dict[key] = getValue(c);
      // dbKey未設定時にこのセルが今まさに使っている既定名（見出し由来かcolNか）。
      // findMappingTargets側で「見出し由来だから目立たせない／colNだから目立たせる」の
      // 判定に使う（builder_app.jsのbuildMappingBlock参照）。
      const autoName = precedingLabel || ('col' + c.col);
      if (collector && !c.blocked) collector.push({ cell: c, rowLabel, groupLabel: context || null, autoName });
      precedingLabel = null;
    });
    return { label: rowLabel, value: dict, hasRealData };
  }
  // 先頭セルが空欄（＝ラベルなしの行。繰り返し項目行など）→ 行全体を1つの無名レコードとして返す
  const dict = {};
  let precedingLabel = null;
  cells.forEach(c => {
    if (c.hasText) { precedingLabel = String(c.value).replace(/\s+/g, ''); return; }
    const key = defaultKeyFor(c, precedingLabel);
    dict[key] = getValue(c);
    const autoName = precedingLabel || ('col' + c.col);
    if (collector && !c.blocked) collector.push({ cell: c, rowLabel: null, groupLabel: context || null, autoName });
    precedingLabel = null;
  });
  return { label: null, value: dict, hasRealData: true };
}

// ---------------------------------------------------------------------------
// メイン：workbook（SheetJSのws）→ 構造化オブジェクト
// ---------------------------------------------------------------------------

function extractStructure(ws, manualGroups) {
  const { grid, maxRow, maxCol } = buildGrid(ws);
  const sections = splitSections(grid, maxRow, maxCol);
  const data = {};
  const meta = { sections: sections.map(s => s.title) };
  for (const sec of sections) {
    data[sec.title] = buildSectionObject(grid, sec.row0, sec.row1, maxCol, null, manualGroups);
  }
  return { grid, maxRow, maxCol, sections, data, meta };
}

// ---------------------------------------------------------------------------
// 書き出し前チェック：現在のグループ化・項目名の設定で、各入力セルの値が
// 実際にJSON出力へ反映されるかどうかを検証する。
// 「推測でラベルなし行を探す」のではなく、各入力セルに固有の目印（セル番地。
// 例：K42）を仮に入れて実際の出力ロジック（buildSectionObject）を走らせ、
// その目印が出力に現れなかったセル＝「入力しても消える」セルとして検出する。
// 既存の静的なラベル文字（hasText）はそのまま使うので、プレビューにも使える。
// ---------------------------------------------------------------------------
function cellRef(info) {
  return colNumToLetter(info.col) + info.row;
}

function findUnreachableCells(grid, sections, maxCol, manualGroups) {
  const markerOf = (info) => (info.hasText ? info.value : cellRef(info));

  const output = {};
  for (const sec of sections) {
    output[sec.title] = buildSectionObject(grid, sec.row0, sec.row1, maxCol, markerOf, manualGroups);
  }

  const reached = new Set();
  const walk = (v) => {
    if (v === null || v === undefined) return;
    if (typeof v === 'string') { reached.add(v); return; }
    if (Array.isArray(v)) { v.forEach(walk); return; }
    if (typeof v === 'object') { Object.keys(v).forEach(k => walk(v[k])); return; }
  };
  walk(output);

  const seen = new Set();
  const unreachable = [];
  for (const info of grid.values()) {
    const key = info.row + ',' + info.col;
    if (seen.has(key)) continue;
    seen.add(key);
    // 対象は「入力欄」のみ（見出し・数式・入力不可セルは元々入力対象ではない）
    if (info.isFormula || info.hasText || info.blocked) continue;
    if (!reached.has(cellRef(info))) {
      // どのセクション（Plan/Do/Check/Action等）にも属さない行（見出しより前の行等）は、
      // グループ化してもbuildSectionObjectの処理対象外のままなので直らない。
      // 「グループ化すれば直る」と誤った案内をしないよう区別しておく。
      const inSection = sections.some(s => info.row >= s.row0 && info.row <= s.row1);
      unreachable.push(Object.assign({}, info, { outOfSection: !inSection }));
    }
  }
  unreachable.sort((a, b) => (a.row - b.row) || (a.col - b.col));
  return { output, unreachable };
}

// ---------------------------------------------------------------------------
// 項目名（dbKey）マッピングの対象になる値セルを一覧化する。実際の書き出しロジック
// （buildSectionObject）にcollectorを差し込んで走らせるだけなので、書き出し結果と
// 定義がズレることがない。行内の直前見出し（「区分」等）で名前が決まるセルも、
// colN任せのセルと同じく一覧に含める（既に意味のある名前が付いているかどうかに関わらず、
// データ構造確認パネルで手直しできるようにするため）。各エントリのautoName（見出し由来か
// colNか）を使って、呼び出し側（builder_app.js）が「既に見出し由来の名前がある」ものと
// 「colNのまま＝目立たせるべき」ものを描画で区別する。
// findUnreachableCells（そもそもJSON出力に含まれないセル）とは別の観点：
// こちらは「出力はされるが、名前をどうするか」の対象。出力に含まれないセルまで
// 混ぜると紛らわしいので、unreachableなセルは呼び出し側で除外すること
// （builder_app.jsのrenderCheckPanel参照）。
//
// グループ（自動検出・手動どちらも）に属し、かつ行自体にラベルが無い
// （＝無名の繰り返し行＝配列の1要素になる行）セルだけを、同じグループ・同じ列で
// 1件にまとめて返す（{ kind:'group', cells:[...], groupLabel, col }）。
// この種の繰り返し行は「同じ意味の項目が複数行に並ぶ」ことがほとんどで、
// 行ごとに別々の項目名を付けると配列の要素ごとにキー名がバラバラになってしまう
// （実際にこのバグが起きた実例で発覚）。列単位でまとめて1つの名前を適用する方が
// 実態に合っている。
// 一方、グループの中にあっても行自体がラベルを持つ場合（例：「1.施設概要」という
// グループの中の「法人名」「事業所名」の各行）は、同じ列でも行ごとに全く別の意味の
// 値であり、列単位でまとめると無関係な行に同じ名前を強制することになってしまう。
// この場合は1件＝1セルのsingleとして扱う（groupLabelは文脈表示のためだけに残す）。
// グループに全く属さないセルも同様に1件＝1セルのsingleとして返す。
// ---------------------------------------------------------------------------
function findMappingTargets(grid, sections, maxCol, manualGroups) {
  const collector = [];
  for (const sec of sections) {
    buildSectionObject(grid, sec.row0, sec.row1, maxCol, null, manualGroups, collector);
  }
  const seen = new Set();
  const flat = [];
  collector.forEach((entry) => {
    const key = entry.cell.row + ',' + entry.cell.col;
    if (seen.has(key)) return;
    seen.add(key);
    flat.push(entry);
  });

  const singles = [];
  // 'groupLabel|col' -> { groupLabel, col, cells: [], autoName }
  // autoNameは列の代表値としてバケット作成時（＝先頭行）の値を採用する。同じ列なら
  // 通常は行によらず同じ見出しパターンになるため（実データで確認済み）、これで十分。
  const groupBuckets = new Map();
  flat.forEach((entry) => {

      const bucketKey = entry.groupLabel + '|' + entry.cell.col;
      if (!groupBuckets.has(bucketKey)) groupBuckets.set(bucketKey, { groupLabel: entry.groupLabel, col: entry.cell.col, cells: [], autoName: entry.autoName });

    kind: 'group', cells: b.cells, rowLabel: null, groupLabel: b.groupLabel, col: b.col, autoName: b.autoName,
  }));

  const byFirstCell = (a, b) => (a.cells[0].row - b.cells[0].row) || (a.cells[0].col - b.cells[0].col);
  singles.sort(byFirstCell);
  groups.sort(byFirstCell);
  return { singles, groups };

// core_logic.js（CoreLogic.cellId／colNumToLetter／buildSectionObject）に依存する。
//
// state の形： { grid, maxRow, maxCol, widths, heights, sections, fileName }
//   - grid: Map<'row,col', CellInfo>（結合解決済み。core_logic.jsのbuildGrid/applyOverrides適用後のもの）
//   - widths/heights: 各列・各行のピクセル寸法の配列（1始まりの列・行番号に合わせ、widths[c-1]でアクセス）
//   - sections: [{title, row0, row1}, ...]（JSON書き出し/読み込みに必要）

// ---------------------------------------------------------------------------
// グリッド描画
// ---------------------------------------------------------------------------

function buildInputControl(info, rowspan, colspan) {
  const type = info.renderType || 'textarea';
  const id = CoreLogic.cellId(info);
  if (type === 'select') {
    const select = el('select', { id });
    select.appendChild(el('option', { value: '' }, [document.createTextNode('（未選択）')]));
    (info.renderOptions || []).forEach(opt => select.appendChild(el('option', { value: opt }, [document.createTextNode(opt)])));
    return select;
  }
  if (type === 'number') {
    const input = el('input', { id });
    input.setAttribute('type', 'number');
    input.classList.add('input-number');

  if (type === 'currency') {
    const input = el('input', { id });
    input.setAttribute('type', 'text');
    input.classList.add('input-currency');
    input.addEventListener('input', () => {
      const digits = input.value.replace(/[^\d]/g, '');
      input.value = digits ? Number(digits).toLocaleString('ja-JP') : '';

    return input;
  }

/**
 * state（grid/maxRow/maxCol/widths/heights）をrootElに描画する。
 * opts.showGear=true のとき各セルに⚙アイコンを付け、クリックでopts.onGear(info)を呼ぶ
 * （手直し機能を持つビルダー専用。生成済み入力フォーム側はfalseにする）。
 * opts.selected（Set<'row,col'>）を渡すと該当セルに .cell-selected を付ける。
 * opts.readonly=true のとき、全ての入力欄（input/textarea/select）にdisabledを付ける
 * （レビュー画面で所管部署の入力内容を閲覧専用で表示する用途）。
 * opts.reviewFieldIds（Set<cellId>）を渡すと、入力セルごとに「1次入力欄」
 * （cell-field-primary）／「2次以降入力欄」（cell-field-review）のクラスを付ける
 * （STRUCTURE.reviewFieldsが1件も無い様式では区別する意味が無いため、Setが空なら何も付けない）。
 * 戻り値：このグリッドに含まれる数式セルのinfo配列（再計算対象として呼び出し元が保持する）。

function renderGrid(rootEl, state, opts) {
  opts = opts || {};
  const { grid, maxRow, maxCol, widths, heights, sections, manualGroups } = state;
  const formulaCells = [];
  rootEl.innerHTML = '';

  // 手動グループ（A）に属する行番号の集合。セルの背景に薄い印を付け、
  // どの範囲がすでにグループ化済みかを一目で分かるようにする。
  // 自動グループ化を解除しただけ（disabled）の範囲は「グループ」ではないので含めない。
  const groupedRows = new Set();

    if (g.disabled) return;

  // 印を付け、「ここは縦結合から自動でグループ化されている」と一目で分かるようにする

  const autoGroupedRows = (sections && sections.length)
    ? CoreLogic.computeAutoGroupRows(grid, sections, maxCol, manualGroups)
    : new Set();

  const table = el('table', { class: 'excel-grid' });
  const colgroup = el('colgroup');
  colgroup.appendChild(el('col', { style: 'width:34px' }));
  for (let c = 1; c <= maxCol; c++) {
    colgroup.appendChild(el('col', { style: `width:${(widths && widths[c - 1]) || 64}px` }));
  }
  table.appendChild(colgroup);

  const theadRow = el('tr', { class: 'ruler-row' });
  theadRow.appendChild(el('th', { class: 'ruler-corner' }));
  for (let c = 1; c <= maxCol; c++) {
    theadRow.appendChild(el('th', { class: 'ruler-col', text: CoreLogic.colNumToLetter(c) }));
  }
  const thead = el('thead');
  thead.appendChild(theadRow);
  table.appendChild(thead);

  const tbody = el('tbody');
  for (let r = 1; r <= maxRow; r++) {
    const tr = el('tr', { style: `height:${(heights && heights[r - 1]) || 22}px` });
    tr.appendChild(el('th', { class: 'ruler-row-num', text: String(r) }));
    for (let c = 1; c <= maxCol; c++) {
      const info = grid.get(r + ',' + c);
      if (!info || info.row !== r || info.col !== c) continue;
      const rowspan = info.row2 - info.row + 1;
      const colspan = info.col2 - info.col + 1;
      const cellKey = info.row + ',' + info.col;
      const td = el('td', {
        rowspan: String(rowspan), colspan: String(colspan),

        const gear = el('button', { class: 'gear-btn', title: 'このセルの種類を設定', type: 'button', text: '⚙' });
        // mousedownの段階で止めないと、複数選択モードのドラッグ選択（td側のmousedown）が
        // 先に発火してしまい、ギアボタンをクリックしただけで意図せずセルが選択状態になる。
        gear.addEventListener('mousedown', (ev) => ev.stopPropagation());
        gear.addEventListener('click', (ev) => { ev.stopPropagation(); opts.onGear && opts.onGear(info); });
        td.appendChild(gear);
      }

      if (info.isFormula) {
        td.className = 'cell-calc';
        const span = el('span', { class: 'calc-val', id: 'calcval_' + CoreLogic.cellId(info), text: '(計算中)' });
        td.appendChild(span);
        formulaCells.push(info);
      } else if (info.blocked) {
        td.className = 'cell-blocked';
      } else if (info.hasText) {
        td.className = 'cell-label';
        if (info.fillColor) td.style.background = '#' + info.fillColor;
        const span = el('span', { text: String(info.value) });
        if (opts.onGear) span.addEventListener('dblclick', () => opts.onGear(info));

        // opts.readonly：レビュー画面の詳細確認（所管部署の入力を閲覧するだけ）用。

function parseCellRef(ref) {
  const m = ref.match(/^([A-Z]+)(\d+)$/);
  if (!m) return null;
  let col = 0;
  for (const ch of m[1]) col = col * 26 + (ch.charCodeAt(0) - 64);
  return { col, row: parseInt(m[2], 10) };
}

function parseSumFormula(formula) {
  const m = String(formula || '').match(/^=SUM\(([A-Z]+\d+):([A-Z]+\d+)\)$/i);
  if (!m) return null;
  const a = parseCellRef(m[1]), b = parseCellRef(m[2]);
  if (!a || !b) return null;
  return { r0: Math.min(a.row, b.row), r1: Math.max(a.row, b.row), c0: Math.min(a.col, b.col), c1: Math.max(a.col, b.col) };
}

function evalFormulaInfo(state, info) {
  const range = parseSumFormula(info.formula);
  if (!range) return null;
  const { grid } = state;
  let sum = 0;
  const seen = new Set();
  for (let r = range.r0; r <= range.r1; r++) {
    for (let c = range.c0; c <= range.c1; c++) {
      const cellInfo = grid.get(r + ',' + c);
      if (!cellInfo) continue;
      const key = cellInfo.row + ',' + cellInfo.col;
      if (seen.has(key)) continue;
      seen.add(key);
      if (cellInfo.isFormula) continue;
      const elx = document.getElementById(CoreLogic.cellId(cellInfo));
      const raw = elx ? elx.value : (cellInfo.hasText ? cellInfo.value : '');
      const num = parseFloat(String(raw).replace(/[,\s]/g, ''));
      if (!isNaN(num)) sum += num;
    }
  }
  return sum;
}

function recalcAllFormulas(state) {
  (state.formulaCells || []).forEach(info => {
    const span = document.getElementById('calcval_' + CoreLogic.cellId(info));
    if (!span) return;
    const val = evalFormulaInfo(state, info);
    span.textContent = val === null ? '（自動計算・数式未対応）' : val.toLocaleString('ja-JP');
  });
}

function buildPrintTable(state) {

  const colgroup = el('colgroup');
  for (let c = 1; c <= maxCol; c++) {
    colgroup.appendChild(el('col', { style: `width:${(widths && widths[c - 1]) || 64}px` }));
  }

function domGetValue(info) {

  return elx ? elx.value : '';

function collectData(state) {
  const { grid, sections, maxCol, fileName, manualGroups } = state;
  const out = { meta: { exported_at: new Date().toISOString(), source_file: fileName } };
  for (const sec of sections) {
    out[sec.title] = CoreLogic.buildSectionObject(grid, sec.row0, sec.row1, maxCol, domGetValue, manualGroups);

  return out;

function loadDataIntoGrid(state, data) {

  for (const sec of sections) {

    fillSection(grid, sec.row0, sec.row1, maxCol, secData, manualGroups);

function fillSection(grid, row0, row1, maxCol, secData, manualGroups) {
  let r = row0;
  const units = [];
  while (r <= row1) {
    const r2 = rowSpanOfLocal(grid, r, maxCol);
    units.push([r, r2]);
    r = r2 + 1;

  let i = 0;
  while (i < units.length) {
    const [u0, u1] = units[i];

    // 手動グループ（A）：core_logic.js の buildSectionObject と対称の実装
    // （書き出し側と読込側で判定条件が食い違うと、値が消える／混線するバグの原因になる）。
    const manualGroup = CoreLogic.findManualGroup(manualGroups, u0);
    // 自動グループ化の解除：グループ化せず、このユニットだけ通常の単発行として扱う
    // （core_logic.js の disabled 早期リターンと対称）。
    if (manualGroup && manualGroup.disabled) {
      // labelOfRowではなくbuildRowEntryを使う理由はrenderSectionFromData側の同種の
      // 呼び出しと同じ（「1行1見出し1値」がdbKeyで改名されている場合に対応するため）。
      const label = CoreLogic.buildRowEntry(grid, u0, u1, maxCol, 1).label;
      if (label && secData[label] !== undefined) fillRow(grid, u0, maxCol, 1, secData[label]);
      i++;
      continue;
    }
    if (manualGroup) {
      const groupEndRow = manualGroup.row1;
      const key = manualGroup.name;
      const childUnits = [];
      let j = i;
      while (j < units.length && units[j][0] <= groupEndRow) { childUnits.push(units[j]); j++; }
      fillGroupChildren(grid, maxCol, childUnits, secData[key], 1, secData);
      i = j;
      continue;
    }

    // 自動検出（縦結合）：core_logic.js の buildSectionObject と対称の実装。
    const groupInfo = grid.get(u0 + ',1');
    if (CoreLogic.isAutoGroupStart(groupInfo, u0, u1)) {
      let groupEndRow = groupInfo.row2;
      const overlappingManual = (manualGroups || [])
        .filter(g => g.row0 > u0 && g.row0 <= groupEndRow)
        .sort((a, b) => a.row0 - b.row0)[0];
      if (overlappingManual) groupEndRow = overlappingManual.row0 - 1;
      const key = String(groupInfo.value).replace(/\s+/g, '');
      const childUnits = [];
      let j = i;
      while (j < units.length && units[j][0] <= groupEndRow) { childUnits.push(units[j]); j++; }
      fillGroupChildren(grid, maxCol, childUnits, secData[key], 2, secData, true);
      i = j;
      continue;
    }

    // labelOfRowではなくbuildRowEntryを使う：「1行1見出し1値」の行が
    // dbKeyで改名されている場合、出力キーはrowLabelではなくdbKeyになる
    // （core_logic.jsのbuildRowEntry参照）。単純にA列の見出し文字だけを見る
    // labelOfRowのままだと、改名後のキーでsecDataを探せず値が読み込めなくなる。
    const label = CoreLogic.buildRowEntry(grid, u0, u1, maxCol, 1).label;
    if (label && secData[label] !== undefined) {
      fillRow(grid, u0, maxCol, 1, secData[label]);
    }
    i++;
  }
}

function rowSpanOfLocal(grid, r, maxCol) {
  let row2 = r;
  for (let c = 2; c <= maxCol; c++) {
    const info = grid.get(r + ',' + c);
    if (info && info.row === r) row2 = Math.max(row2, info.row2);
  }
  return row2;
}

// グループ（手動／自動検出どちらも）の子ユニット群に、書き出し済みのgroupValを流し込む。
// core_logic.jsのbuildSectionObject／groupChildrenToResultと対称の実装：
// 書き出し側は実データを持たない子（見出し行の残骸。CoreLogic.buildRowEntryの
// hasRealData=false）をレコードから除外しているため、読込側も同じ
// CoreLogic.buildRowEntry（label・hasRealDataの判定そのもの）を使って同じ子だけを
// 対象にする。ラベルの有無だけを見る簡易版（旧labelOfRow）では、実データを持たない
// 「ラベルなしの空行」まで拾ってしまい配列のインデックスがずれる場合があった。
// secDataはセクション全体のデータ（groupValの親）。無名の繰り返し行と「その他」の
// ような名前付き行が混在するグループでは、書き出し側は名前付きの行をグループの外側
// （secData直下、通常の単発行と同じ扱い）に出力しているため、読込側もそちらを見る。
// requireMultiple：core_logic.jsのgroupChildrenToResultと同じ意味・同じ呼び出し条件
// （自動検出グループの呼び出し元だけtrueを渡す）。子が1件だけなら辞書化せず、
// secData直下の独立キーとして復元する（既知バグの修正・読み込み側の対称実装）。
function fillGroupChildren(grid, maxCol, childUnits, groupVal, fromCol, secData, requireMultiple) {
  const entries = childUnits.map(([cu0, cu1]) => [cu0, CoreLogic.buildRowEntry(grid, cu0, cu1, maxCol, fromCol)]);
  const real = entries.filter(([, e]) => e.hasRealData);
  const minCount = requireMultiple ? 1 : 0;
  const allNamed = real.length > minCount && real.every(([, e]) => e.label);
  if (allNamed) {
    if (!groupVal) return;
    real.forEach(([cu0, e]) => {
      if (groupVal[e.label] !== undefined) fillRow(grid, cu0, maxCol, fromCol, groupVal[e.label]);
    });
    return;
  }
  if (Array.isArray(groupVal)) {
    const unlabeled = real.filter(([, e]) => !e.label);
    unlabeled.forEach(([cu0], idx) => fillRow(grid, cu0, maxCol, fromCol, groupVal[idx]));
  }
  const labeled = real.filter(([, e]) => e.label);
  labeled.forEach(([cu0, e]) => {
    if (secData && secData[e.label] !== undefined) fillRow(grid, cu0, maxCol, fromCol, secData[e.label]);
  });
}

function fillRow(grid, r0, maxCol, fromCol, rowVal) {
  if (rowVal === undefined || rowVal === null) return;
  const cells = [];
  const seen = new Set();
  for (let c = fromCol; c <= maxCol; c++) {
    const info = grid.get(r0 + ',' + c);
    if (!info || info.row !== r0 || info.isFormula) continue;
    const key = info.row + ',' + info.col;
    if (seen.has(key)) continue;
    seen.add(key);
    cells.push(info);
  }
  if (cells.length === 0) return;
  const first = cells[0];
  const valueCells = first.hasText ? cells.slice(1) : cells;
  if (typeof rowVal === 'object' && !Array.isArray(rowVal)) {
    // core_logic.js の buildRowEntry と対称のキー導出（見出しセルはスキップし、
    // 直前の見出し文字を既定の項目名として使う）。ずれると読込時に値が拾えなくなる。
    let precedingLabel = null;
    valueCells.forEach(c => {
      if (c.hasText) { precedingLabel = String(c.value).replace(/\s+/g, ''); return; }
      const v = rowVal[CoreLogic.defaultKeyFor(c, precedingLabel)];
      if (v !== undefined) setDomValue(c, v);
    });
  } else if (valueCells.length === 1) {
    setDomValue(valueCells[0], rowVal);
  }
}

function setDomValue(info, v) {
  const elx = document.getElementById(CoreLogic.cellId(info));
  if (elx) elx.value = v === null || v === undefined ? '' : v;
}

// ---------------------------------------------------------------------------
// 貼り付け対応（簡易版：タブ区切りテキストを、選択中セルを起点に貼り付ける）
// ---------------------------------------------------------------------------

function setupPasteHandler(state, statusEl) {
  document.addEventListener('paste', (ev) => {
    const active = document.activeElement;
    if (!active || !active.id || !active.id.startsWith('cell_')) return;
    const text = (ev.clipboardData || window.clipboardData).getData('text');
    if (!text || (text.indexOf('\t') === -1 && text.indexOf('\n') === -1)) return;
    ev.preventDefault();
    const m = active.id.match(/^cell_R(\d+)_C(\d+)$/);
    if (!m) return;
    const startRow = parseInt(m[1], 10), startCol = parseInt(m[2], 10);
    const rows = text.replace(/\r/g, '').split('\n').filter((_, i, arr) => !(i === arr.length - 1 && arr[i] === ''));
    rows.forEach((line, ri) => {
      const cols = line.split('\t');
      cols.forEach((val, ci) => {
        const target = document.getElementById(`cell_R${startRow + ri}_C${startCol + ci}`);
        if (target) target.value = val;
      });
    });
    recalcAllFormulas(state);
    if (statusEl) statusEl.textContent = `貼り付けました（${rows.length}行）。空欄でないセルの一部が対応する入力欄に反映されていない場合があります。結果をご確認ください。`;
  });
  document.addEventListener('input', (ev) => {
    if (ev.target && ev.target.id && ev.target.id.startsWith('cell_')) recalcAllFormulas(state);
  });
}

return {
  buildInputControl, renderGrid, buildPrintTable, collectData, loadDataIntoGrid, recalcAllFormulas,
  setupPasteHandler,
};
});

// 住民公開ページ（ツール4）側のロジック。読み取り専用・書き込みは一切行わない。
// STRUCTURE（様式構造）・RECORDS（各事業の生データ配列）・PUBLIC_CONFIG（集約ツールが
// 設定した表示・集計・検索項目や説明文）はビルド時ではなく、集約ツールの
// 「住民公開用ページを書き出す」操作時にこのファイルへ直接注入される。
// ☑・メモはlocalStorageにのみ保存し、どこにも送信しない（バックアップはJSON書き出しのみ）。

function $(sel) { return document.querySelector(sel); }

function el(tag, attrs, children) {
  const e = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    if (k === 'text') e.textContent = attrs[k];
    else if (k === 'html') e.innerHTML = attrs[k];
    else e.setAttribute(k, attrs[k]);
  }
  (children || []).forEach(c => c && e.appendChild(c));
  return e;
}

// filler_app.js/aggregator_app.jsと同じ形（STRUCTURE.cellsからgrid Mapを復元する）。
function buildStateFromStructure(structure) {
  const grid = new Map();
  structure.cells.forEach(c => {
    const info = Object.assign({}, c);
    for (let r = c.row; r <= c.row2; r++) {
      for (let cc = c.col; cc <= c.col2; cc++) {
        grid.set(r + ',' + cc, info);
      }
    }
  });
  return {
    grid,
    maxRow: structure.maxRow,
    maxCol: structure.maxCol,
    widths: structure.widths,
    heights: structure.heights,
    sections: structure.sections,
    fileName: structure.formTitle || 'jigyo',
    manualGroups: structure.manualGroups || [],
  };
}

const BASE_STATE = null; // 使わない（各所で使い捨てstateをbuildStateFromStructureから作る）

// extractFieldValues（filler_app.js）と同じ「使い捨てグリッドに読み込ませてDOM経由で読む」方式。
function scratchExtract(data, cellIds) {
  if (!cellIds || cellIds.length === 0) return {};
  const scratch = $('#viewer-scratch-root');
  const tempState = buildStateFromStructure(STRUCTURE);
  GridRender.renderGrid(scratch, tempState, { showGear: false });
  GridRender.loadDataIntoGrid(tempState, data || {});
  const out = {};
  cellIds.forEach((id) => {
    const inputEl = document.getElementById(id);
    out[id] = inputEl ? inputEl.value : '';
  });
  scratch.innerHTML = '';
  return out;
}

let DETAIL_STATE = null;

const STORAGE_KEY = (PUBLIC_CONFIG && PUBLIC_CONFIG.storageKey) || 'jimujigyou_viewer';

function loadLocalState() {
  try {
    const raw = window.localStorage.getItem(STORAGE_KEY);
    if (!raw) return { checked: [], memos: {} };
    const parsed = JSON.parse(raw);
    return { checked: parsed.checked || [], memos: parsed.memos || {} };
  } catch (e) {
    return { checked: [], memos: {} };
  }
}

function saveLocalState() {
  try {
    window.localStorage.setItem(STORAGE_KEY, JSON.stringify({
      checked: Array.from(V.checked),
      memos: Object.fromEntries(V.memos),
    }));
  } catch (e) { /* localStorageが使えない環境では、バックアップは諦めて閲覧自体は継続する */ }
}

const V = {
  records: [],        // [{id, data, displayValues, searchText}]
  checked: new Set(),
  memos: new Map(),
  colFilters: new Map(),
  keyword: '',
  onlyChecked: false,
  sortKey: null,
  sortDir: 'asc',
  visibleCols: new Set(),
  showMemoColumn: false, // ON時：一覧にメモ本文をそのまま表示し、印刷にも含める
};

// 表示項目（PUBLIC_CONFIG.displayFields）は{label, ids}の配列。idsは単独欄なら1件、
// 繰り返し列（Excelの合計セルと同じ範囲）なら行数分。列見出し・絞り込み・並び替え・
// V.visibleCols等で扱いやすいよう、各項目に短い内部キー（df0, df1, ...）を振り直して
// 保持する（idsをそのまま連結した文字列だとDOM要素idとして冗長・不安定になるため）。
const DISPLAY_FIELDS = (PUBLIC_CONFIG.displayFields || []).map((f, idx) => ({ key: 'df' + idx, label: f.label, ids: f.ids || [] }));

function displayIds() { return DISPLAY_FIELDS.map(f => f.key); }
function displayFieldByKey(key) { return DISPLAY_FIELDS.find(f => f.key === key); }
function labelForFieldKey(key) {
  const f = displayFieldByKey(key);
  return f ? f.label : key;
}
function allDisplayCellIds() {
  const out = [];
  DISPLAY_FIELDS.forEach(f => out.push(...f.ids));
  return out;
}
function searchIds() {
  const s = PUBLIC_CONFIG.searchFields || [];
  return s.length > 0 ? s : allDisplayCellIds();
}
// 集計対象の実セルid（単独欄は1件、繰り返し列（Excelの合計セルと同じ範囲）は行数分）を
// すべて平らにしたもの。aggregator_app.jsのbuildAggregateFieldConfigsが単独欄・繰り返し列を
// 同じ{label,unit,ids}形に正規化しているため、種別を意識せず扱える。
function aggregateIds() {
  const out = [];
  (PUBLIC_CONFIG.aggregateFields || []).forEach(f => out.push(...(f.ids || [])));
  return out;
}

// 1項目分の表示値を作る：idsが1件（単独欄）ならその値をそのまま、複数件（繰り返し列）なら
// 数値として事業内で合計する（②集計対象と同じ考え方。繰り返し列は数値・金額型のみが
// 候補になっているため、複数件は必ず合計できる前提でよい）。
function computeFieldDisplayValue(rawValues, ids) {
  if (!ids || ids.length === 0) return '';
  if (ids.length === 1) return rawValues[ids[0]] || '';
  let sum = 0;
  let any = false;
  ids.forEach((id) => {
    const n = parseFloat(String(rawValues[id] || '').replace(/[,\s]/g, ''));
    if (!isNaN(n)) { sum += n; any = true; }
  });
  return any ? sum.toLocaleString('ja-JP') : '';
}

function initRecords() {
  const allCellIds = Array.from(new Set([
    ...allDisplayCellIds(),
    ...searchIds(),
    ...aggregateIds(),
  ]));
  V.records = (RECORDS || []).map((data, idx) => {
    const rawValues = scratchExtract(data, allCellIds);
    const displayValues = {};
    DISPLAY_FIELDS.forEach((f) => { displayValues[f.key] = computeFieldDisplayValue(rawValues, f.ids); });
    const searchText = searchIds().map(id => rawValues[id] || '').join(' ').toLowerCase();
    // rawValues（実セルidキー）はrenderSummaryの集計対象（PUBLIC_CONFIG.aggregateFields[].ids、
    // 実セルidの配列）を合計する際に使う。displayValues（表示項目のdfキー）とはキー体系が
    // 異なるため両方を保持する。
    return { id: idx, data, rawValues, displayValues, searchText };
  });
}

function toggleChecked(id) {
  if (V.checked.has(id)) V.checked.delete(id); else V.checked.add(id);
  saveLocalState();
}

function setMemo(id, text) {
  if (text) V.memos.set(id, text); else V.memos.delete(id);
  saveLocalState();
}

function currentDisplayIds() {
  return displayIds().filter(id => V.visibleCols.has(id));
}

function columnValue(record, id) { return record.displayValues[id] || ''; }

function uniqueColumnValues(id) {
  const set = new Set();
  V.records.forEach(r => set.add(columnValue(r, id)));
  return Array.from(set).sort((a, b) => String(a).localeCompare(String(b), 'ja'));
}

function matchesFilters(record) {
  if (V.onlyChecked && !V.checked.has(record.id)) return false;
  if (V.keyword && record.searchText.indexOf(V.keyword.toLowerCase()) === -1) return false;
  for (const id of currentDisplayIds()) {
    const allowed = V.colFilters.get(id);
    if (!allowed) continue;
    if (!allowed.has(columnValue(record, id))) return false;
  }
  return true;
}

function filteredSortedRecords() {
  let list = V.records.filter(matchesFilters);
  if (V.sortKey) {
    list = list.slice().sort((a, b) => {
      const av = columnValue(a, V.sortKey);
      const bv = columnValue(b, V.sortKey);
      const an = parseFloat(String(av).replace(/[,\s]/g, ''));
      const bn = parseFloat(String(bv).replace(/[,\s]/g, ''));
      let cmp;
      if (!isNaN(an) && !isNaN(bn)) cmp = an - bn;
      else cmp = String(av).localeCompare(String(bv), 'ja');
      return V.sortDir === 'asc' ? cmp : -cmp;
    });
  }
  return list;
}

function hasActiveFilters() { return V.colFilters.size > 0; }

// 集計欄：文字を横並びに連結するだけだと目立たないため、各項目を「ラベル＋大きめの数値」の
// チップとして描画する（CSS側は#viewer-summary/.summary-item/.summary-value参照）。
function renderSummary(list) {
  const root = $('#viewer-summary');
  root.innerHTML = '';
  const items = [];
  if (PUBLIC_CONFIG.showRecordCount !== false) {
    const label = hasActiveFilters() || V.keyword || V.onlyChecked ? `件数（全${V.records.length}件中）` : '件数';
    items.push({ label, value: `${list.length}件` });
  }
  // f.ids：単独欄なら1件、繰り返し列（Excelの合計セルと同じ範囲）なら行数分。事業内で
  // まず合計してから、事業間でさらに合計する（＝行数に関わらずidsを全部足せば同じ結果）。
  (PUBLIC_CONFIG.aggregateFields || []).forEach((f) => {
    let sum = 0;
    list.forEach((r) => {
      (f.ids || []).forEach((id) => {
        const n = parseFloat(String(r.rawValues[id] || '').replace(/[,\s]/g, ''));
        if (!isNaN(n)) sum += n;
      });
    });
    items.push({ label: `${f.label}合計`, value: `${sum.toLocaleString('ja-JP')}${f.unit || ''}` });
  });
  items.forEach((item) => {
    root.appendChild(el('span', { class: 'summary-item' }, [
      el('span', { class: 'summary-label', text: item.label }),
      el('span', { class: 'summary-value', text: item.value }),
    ]));
  });
}

// filler_app.js（buildColFilterDetails）と同じ考え方：<details>をExcel風▼として使い、
// パネルはdocument.body直下にposition:fixedで配置する（#viewer-table-rootのoverflow-x:auto
// によるクリップを避けるため）。
let filterPanelNodes = [];
function removeFilterPanelNodes() {
  filterPanelNodes.forEach(p => p.remove());
  filterPanelNodes = [];
}

function buildColFilterDetails(id) {
  const values = uniqueColumnValues(id);
  const details = el('details', { class: 'col-filter' });
  const summary = el('summary', { text: '▼', title: '値で絞り込む' });
  details.appendChild(summary);
  const panel = el('div', { class: 'col-filter-panel' });
  panel.style.display = 'none';
  values.forEach((v, idx) => {
    const inputId = 'colfilter_' + id + '_' + idx;
    const cb = el('input', { type: 'checkbox', id: inputId });
    const currentAllowed = V.colFilters.get(id);
    if (!currentAllowed || currentAllowed.has(v)) cb.setAttribute('checked', 'checked');
    cb.addEventListener('change', () => {
      const allowed = new Set(V.colFilters.get(id) || values);
      if (cb.checked) allowed.add(v); else allowed.delete(v);
      V.colFilters.set(id, allowed);
      renderList();
    });
    panel.appendChild(el('label', {}, [cb, document.createTextNode(v === '' ? '（空欄）' : v)]));
  });
  document.body.appendChild(panel);
  filterPanelNodes.push(panel);
  details.addEventListener('toggle', () => {
    if (details.open) {
      const rect = summary.getBoundingClientRect();
      panel.style.position = 'fixed';
      panel.style.top = rect.bottom + 'px';
      panel.style.left = rect.left + 'px';
      panel.style.display = 'block';
    } else {
      panel.style.display = 'none';
    }
  });
  return details;
}

function buildMemoCell(record) {
  const details = el('details', { class: 'memo-popover' });
  const summary = el('summary', { text: V.memos.get(record.id) ? '📝あり' : '📝', title: 'メモを編集（この端末にのみ保存）' });
  details.appendChild(summary);
  const panel = el('div', { class: 'memo-panel' });
  panel.style.display = 'none';
  const textarea = el('textarea', {});
  textarea.value = V.memos.get(record.id) || '';
  textarea.addEventListener('input', () => {
    setMemo(record.id, textarea.value);
    summary.textContent = textarea.value ? '📝あり' : '📝';
  });
  panel.appendChild(textarea);
  document.body.appendChild(panel);
  filterPanelNodes.push(panel);
  details.addEventListener('toggle', () => {
    if (details.open) {
      const rect = summary.getBoundingClientRect();
      panel.style.position = 'fixed';
      panel.style.top = rect.bottom + 'px';
      panel.style.left = rect.left + 'px';
      panel.style.display = 'block';
    } else {
      panel.style.display = 'none';
    }
  });
  return details;
}

function renderColToggle() {
  const root = $('#viewer-col-toggle');
  root.innerHTML = '';
  if (displayIds().length === 0) return;
  root.appendChild(el('span', { text: '表示する項目：' }));
  displayIds().forEach((id) => {
    const inputId = 'colvis_' + id;
    const cb = el('input', { type: 'checkbox', id: inputId });
    if (V.visibleCols.has(id)) cb.setAttribute('checked', 'checked');
    cb.addEventListener('change', () => {
      if (cb.checked) V.visibleCols.add(id); else V.visibleCols.delete(id);
      renderList();
    });
    root.appendChild(el('label', { for: inputId }, [cb, el('span', { text: labelForFieldKey(id) })]));
  });
}

function renderList() {
  const list = filteredSortedRecords();
  renderSummary(list);

  const tableRoot = $('#viewer-table-root');
  tableRoot.innerHTML = '';
  removeFilterPanelNodes();

  const ids = currentDisplayIds();
  const table = el('table', { class: 'viewer-table' });
  const thead = el('thead');
  const headRow = el('tr');
  ids.forEach((id) => {
    const th = el('th');
    const arrow = V.sortKey === id ? (V.sortDir === 'asc' ? ' ▲' : ' ▼') : '';
    const sortBtn = el('button', { class: 'sort-btn', type: 'button', text: labelForFieldKey(id) + arrow });
    sortBtn.addEventListener('click', () => {
      if (V.sortKey === id) V.sortDir = V.sortDir === 'asc' ? 'desc' : 'asc';
      else { V.sortKey = id; V.sortDir = 'asc'; }
      renderList();
    });
    th.appendChild(sortBtn);
    th.appendChild(buildColFilterDetails(id));
    headRow.appendChild(th);
  });
  headRow.appendChild(el('th', { text: '気になる／メモ' }));
  // 「メモを表示」ONのときだけ、メモ本文をそのまま読める列を追加する（画面表示と印刷の
  // 両方に反映される＝「表示中の事業を印刷」が見えている通りの内容になる）。
  if (V.showMemoColumn) headRow.appendChild(el('th', { text: 'メモ内容' }));
  headRow.appendChild(el('th', { text: '' }));
  thead.appendChild(headRow);
  table.appendChild(thead);

  const tbody = el('tbody');
  list.forEach((record) => {
    const tr = el('tr');
    ids.forEach(id => tr.appendChild(el('td', { text: record.displayValues[id] || '' })));

    const chkTd = el('td', { class: 'viewer-chk-cell' });
    const chk = el('input', { type: 'checkbox' });
    if (V.checked.has(record.id)) chk.setAttribute('checked', 'checked');
    chk.addEventListener('change', () => toggleChecked(record.id));
    chkTd.appendChild(chk);
    chkTd.appendChild(buildMemoCell(record));
    tr.appendChild(chkTd);

    if (V.showMemoColumn) {
      tr.appendChild(el('td', { class: 'viewer-memo-text-cell', text: V.memos.get(record.id) || '' }));
    }

    const btnTd = el('td');
    const detailBtn = el('button', { type: 'button', text: '詳細' });
    detailBtn.addEventListener('click', () => openDetail(record.id));
    btnTd.appendChild(detailBtn);
    tr.appendChild(btnTd);

    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  tableRoot.appendChild(table);
}

// ---------------------------------------------------------------------------
// 詳細画面
// ---------------------------------------------------------------------------
function showScreen(name) {
  $('#list-root').style.display = name === 'list' ? '' : 'none';
  $('#detail-root').style.display = name === 'detail' ? '' : 'none';
}

function findRecord(id) { return V.records.find(r => r.id === id); }

function renderDetail(id) {
  const record = findRecord(id);
  if (!record) return;

  const bar = $('#detail-summary-bar');
  bar.innerHTML = '';
  displayIds().forEach((fid) => {
    bar.appendChild(el('div', { class: 'detail-field' }, [
      el('span', { class: 'k', text: labelForFieldKey(fid) }),
      el('span', { class: 'v', text: record.displayValues[fid] || '' }),
    ]));
  });
  const chk = el('input', { type: 'checkbox', id: 'detail-check' });
  if (V.checked.has(id)) chk.setAttribute('checked', 'checked');
  chk.addEventListener('change', () => toggleChecked(id));
  bar.appendChild(el('label', { class: 'detail-check-label', for: 'detail-check' }, [chk, document.createTextNode('気になる')]));

  const memoBox = el('textarea', { id: 'detail-memo', placeholder: 'メモ（この端末にのみ保存されます）' });
  memoBox.value = V.memos.get(id) || '';
  memoBox.addEventListener('input', () => setMemo(id, memoBox.value));
  bar.appendChild(memoBox);

  const root = $('#detail-body-root');
  root.innerHTML = '';
  DETAIL_STATE = buildStateFromStructure(STRUCTURE);
  GridRender.renderGrid(root, DETAIL_STATE, { showGear: false, readonly: true });
  GridRender.loadDataIntoGrid(DETAIL_STATE, record.data || {});

  const list = filteredSortedRecords();
  const idx = list.findIndex(r => r.id === id);
  $('#detail-prev').disabled = idx <= 0;
  $('#detail-next').disabled = idx < 0 || idx >= list.length - 1;
  $('#detail-prev').onclick = () => { if (idx > 0) openDetail(list[idx - 1].id); };
  $('#detail-next').onclick = () => { if (idx >= 0 && idx < list.length - 1) openDetail(list[idx + 1].id); };
}

// URLのハッシュ部分だけを書き換える（一覧⇔詳細の画面遷移自体はこの関数を経由せず内部状態
// だけで行うため、失敗しても機能には影響しない。あくまでブックマーク・直リンク用のおまけ）。
// 実機確認で判明：file://で開いた場合、location.hash=・history.replaceStateのどちらで
// URLを書き換えても、環境によっては「Unsafe attempt to load URL...file: URLs are treated
// as unique security origins」としてブロックされ、コンソールにエラーが出続けることがある
// （http(s)://で配信した場合は問題なし、実機のPlaywrightで確認済み）。file://はローカルで
// 直接開く用途がほとんどでURL共有の意味も薄いため、file://のときはURL書き換え自体を
// 最初から試みない（try/catchで握りつぶすだけでは、ブロックされたこと自体がコンソールに
// エラーとして残り続けるため、根本的にスキップするほうが確実）。
const HASH_NAV_SUPPORTED = window.location.protocol !== 'file:';

function setUrlHash(hash) {
  if (!HASH_NAV_SUPPORTED) return;
  if (window.location.hash === hash) return;
  try {
    if (window.history && window.history.replaceState) {
      const base = window.location.pathname + window.location.search;
      window.history.replaceState(null, '', hash ? base + hash : base);
    } else {
      window.location.hash = hash;
    }
  } catch (e) { /* 万一ブロックされても表示は続行する */ }
}

function openDetail(id) {
  if (!findRecord(id)) return;
  setUrlHash('#detail-' + id);
  renderDetail(id);
  showScreen('detail');
}

function backToList() {
  setUrlHash('');
  showScreen('list');
  renderList();
}

function handleHashChange() {
  const m = window.location.hash.match(/^#detail-(\d+)$/);
  if (m) {
    const id = parseInt(m[1], 10);
    if (findRecord(id)) { renderDetail(id); showScreen('detail'); return; }
  }
  showScreen('list');
}

// ---------------------------------------------------------------------------
// 印刷（現在表示中＝一覧に見えている表をそのまま1枚の表として印刷）／単発印刷（詳細画面）
// 「☑を付けた事業だけ印刷したい」場合は、①「気になる事業だけ表示」で絞り込んでから
// ②この共通の印刷ボタンを押す、という2段階の操作にする（専用の別ボタンは持たない）。
// メモの有無は「メモを表示」トグル（V.showMemoColumn）に従う＝画面の見た目と一致させる。
// ---------------------------------------------------------------------------
function printFiltered() {
  const list = filteredSortedRecords();
  const root = $('#viewer-print-root');
  root.innerHTML = '';
  if (list.length === 0) return;

  const ids = currentDisplayIds();
  const table = el('table', { class: 'viewer-print-list-table' });
  const thead = el('thead');
  const headRow = el('tr');
  ids.forEach(id => headRow.appendChild(el('th', { text: labelForFieldKey(id) })));
  headRow.appendChild(el('th', { text: '気になる' }));
  if (V.showMemoColumn) headRow.appendChild(el('th', { text: 'メモ内容' }));
  thead.appendChild(headRow);
  table.appendChild(thead);

  const tbody = el('tbody');
  list.forEach((r) => {
    const tr = el('tr');
    ids.forEach(id => tr.appendChild(el('td', { text: r.displayValues[id] || '' })));
    tr.appendChild(el('td', { class: 'viewer-print-chk', text: V.checked.has(r.id) ? '☑' : '' }));
    if (V.showMemoColumn) tr.appendChild(el('td', { text: V.memos.get(r.id) || '' }));
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);

  const section = el('div', { class: 'bulk-print-record' });
  if (PUBLIC_CONFIG.title) section.appendChild(el('h3', { text: PUBLIC_CONFIG.title }));
  section.appendChild(table);
  root.appendChild(section);

  document.body.classList.add('bulk-printing');
  window.print();
}

function printSingleSnapshot(state, heading) {
  const table = GridRender.buildPrintTable(state);
  const root = $('#viewer-print-root');
  root.innerHTML = '';
  const section = el('div', { class: 'bulk-print-record' });
  if (heading) section.appendChild(el('h2', { text: heading }));
  section.appendChild(table);
  root.appendChild(section);
  document.body.classList.add('bulk-printing');
  window.print();
}

function cleanupBulkPrint() {
  document.body.classList.remove('bulk-printing');
  const root = $('#viewer-print-root');
  if (root) root.innerHTML = '';
}

// ---------------------------------------------------------------------------
// ☑・メモのバックアップ（JSON書き出し／読み込み）。個人用バックアップが目的で、
// 自治体への送信・集計は行わない（サーバー非経由・localStorageのみ）。
// ---------------------------------------------------------------------------
function downloadBlobSimple(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
}

function exportBackup() {
  const payload = { checked: Array.from(V.checked), memos: Object.fromEntries(V.memos) };
  const dateStr = new Date().toISOString().slice(0, 10).replace(/-/g, '');
  const filename = `${PUBLIC_CONFIG.title || 'viewer'}_チェックとメモ_${dateStr}.json`;
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  downloadBlobSimple(blob, filename);
}

function readFileAsText(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsText(file, 'utf-8');
  });
}

async function importBackup(file) {
  try {
    const text = await readFileAsText(file);
    const parsed = JSON.parse(text);
    V.checked = new Set((parsed.checked || []).filter(id => findRecord(id)));
    V.memos = new Map(Object.entries(parsed.memos || {}).filter(([id]) => findRecord(Number(id))).map(([id, v]) => [Number(id), v]));
    saveLocalState();
    renderList();
  } catch (e) { /* 壊れたJSONは無視 */ }
}

function init() {
  initRecords();
  V.visibleCols = new Set(displayIds());
  const local = loadLocalState();
  V.checked = new Set(local.checked);
  V.memos = new Map(Object.entries(local.memos).map(([k, v]) => [Number(k), v]));

  $('#viewer-title').textContent = PUBLIC_CONFIG.title || '';
  $('#viewer-description').textContent = PUBLIC_CONFIG.description || '';
  $('#viewer-source').textContent = PUBLIC_CONFIG.source || '';
  $('#viewer-updated').textContent = PUBLIC_CONFIG.updatedDate ? `　データ最終更新日：${PUBLIC_CONFIG.updatedDate}` : '';

  $('#viewer-keyword').addEventListener('input', (ev) => { V.keyword = ev.target.value; renderList(); });
  $('#viewer-only-checked').addEventListener('change', (ev) => { V.onlyChecked = ev.target.checked; renderList(); });
  $('#viewer-show-memo').addEventListener('change', (ev) => { V.showMemoColumn = ev.target.checked; renderList(); });
  $('#btn-print-checked').addEventListener('click', printFiltered);
  $('#btn-export-backup').addEventListener('click', exportBackup);
  $('#backup-file-input').addEventListener('change', (ev) => {
    if (ev.target.files[0]) importBackup(ev.target.files[0]);
    ev.target.value = '';
  });
  $('#btn-back-to-list').addEventListener('click', backToList);
  $('#btn-print-detail').addEventListener('click', () => printSingleSnapshot(DETAIL_STATE, PUBLIC_CONFIG.title));
  window.addEventListener('afterprint', cleanupBulkPrint);
  window.addEventListener('hashchange', handleHashChange);

  renderColToggle();
  renderList();
  handleHashChange();
}

if (typeof window !== 'undefined') {
  window.addEventListener('DOMContentLoaded', init);
  window.__app = {
    get V() { return V; },
    initRecords, renderList, renderColToggle, renderSummary,
    openDetail, backToList, renderDetail, handleHashChange,
    toggleChecked, setMemo, filteredSortedRecords,
    printFiltered, printSingleSnapshot, cleanupBulkPrint,
    exportBackup, importBackup, loadLocalState, saveLocalState,
    labelForFieldKey, displayIds, allDisplayCellIds,
    get DETAIL_STATE() { return DETAIL_STATE; },
    init,
  };
}
