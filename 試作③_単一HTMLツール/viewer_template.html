<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>__VIEWER_TITLE__</title>
<style>
  :root{
    --bg:#f7f5f0; --card:#ffffff; --ink:#2b2b28; --sub:#54514a;
    --line:#c9c4b4; --accent:#3d6b52; --accent-bg:#e9f2ec;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--ink); font-family:"Yu Gothic","Hiragino Sans","Meiryo",sans-serif;}
  .wrap{max-width:1200px; margin:0 auto; padding:24px 16px 80px;}
  h1{font-size:1.3rem; margin:0 0 6px;}
  p.lead{color:var(--sub); font-size:.88rem; margin:0 0 6px; line-height:1.6; white-space:pre-wrap;}
  p.viewer-meta{color:var(--sub); font-size:.76rem; margin:0 0 18px;}
  button{
    font-family:inherit; font-size:.85rem; padding:8px 14px; border-radius:6px; border:1px solid var(--accent);
    background:var(--accent); color:#fff; cursor:pointer;
  }
  button.secondary{background:#fff; color:var(--accent);}
  button:disabled{opacity:.5; cursor:not-allowed;}
  .hint{font-size:.76rem; color:var(--sub); margin-top:6px;}
  .detail-back-hint{display:inline-block; margin:0 0 0 10px; vertical-align:middle;}
  .ai-note{font-size:.72rem; color:var(--sub); margin-top:18px; opacity:.85;}
  .action-bar{display:flex; gap:10px; align-items:center; margin:8px 0 16px; flex-wrap:wrap;}

  #viewer-search-bar{display:flex; gap:10px; align-items:center; margin:10px 0; flex-wrap:wrap;}
  #viewer-keyword{flex:1 1 240px; padding:8px 10px; border:1px solid var(--line); border-radius:6px; font-size:.85rem; font-family:inherit;}
  #viewer-only-checked-label, #viewer-show-memo-label{display:flex; align-items:center; gap:6px; font-size:.82rem; white-space:nowrap;}
  .viewer-memo-text-cell{white-space:pre-wrap; max-width:260px;}

  #viewer-col-toggle{display:flex; flex-wrap:wrap; gap:6px 14px; margin:10px 0; padding:8px 10px; background:var(--card); border:1px solid var(--line); border-radius:6px; font-size:.78rem;}
  #viewer-col-toggle label{display:flex; align-items:center; gap:4px; cursor:pointer; white-space:nowrap;}
  #viewer-summary{
    display:flex; flex-wrap:wrap; gap:8px 22px; align-items:baseline; margin:12px 0;
    background:var(--accent-bg); border:1px solid var(--accent); border-radius:8px; padding:10px 16px;
  }
  .summary-item{display:flex; align-items:baseline; gap:6px; white-space:nowrap;}
  .summary-label{font-size:.78rem; color:var(--sub);}
  .summary-value{font-size:1.15rem; font-weight:bold; color:var(--accent);}

  #viewer-table-root{overflow-x:auto;}
  table.viewer-table{border-collapse:collapse; width:100%; font-size:.8rem; background:var(--card);}
  table.viewer-table th, table.viewer-table td{border:1px solid var(--line); padding:6px 8px; text-align:left; vertical-align:top;}
  table.viewer-table th{background:#eeeae0; white-space:nowrap;}
  .sort-btn{background:none; border:none; color:var(--ink); padding:0; font-size:.8rem; font-weight:bold; cursor:pointer;}
  .col-filter{display:inline-block; font-weight:normal;}
  .col-filter summary{cursor:pointer; list-style:none; display:inline-block; padding:0 2px;}
  .col-filter summary::-webkit-details-marker{display:none;}
  .col-filter-panel{
    z-index:10; min-width:140px; max-height:220px;
    overflow:auto; background:#fff; border:1px solid var(--line); border-radius:4px; padding:6px 8px;
    box-shadow:0 2px 6px rgba(0,0,0,.15); font-size:.76rem;
  }
  .col-filter-panel label{display:flex; align-items:center; gap:4px; white-space:nowrap; padding:2px 0; cursor:pointer;}
  .memo-popover{display:inline-block;}
  .memo-popover summary{cursor:pointer; list-style:none; font-size:.85rem;}
  .memo-popover summary::-webkit-details-marker{display:none;}
  .memo-panel{
    z-index:10; width:240px; background:#fff; border:1px solid var(--line); border-radius:6px; padding:8px;
    box-shadow:0 2px 6px rgba(0,0,0,.15);
  }
  .memo-panel textarea{width:100%; min-height:80px; font-family:inherit; font-size:.8rem; box-sizing:border-box; padding:6px; border:1px solid var(--line); border-radius:4px;}
  .viewer-chk-cell{white-space:nowrap;}

  #detail-summary-bar{
    position:sticky; top:0; z-index:5; background:var(--accent-bg); border:1px solid var(--line); border-radius:8px;
    padding:12px 14px; margin-bottom:14px; display:flex; flex-wrap:wrap; gap:12px 20px; align-items:flex-start;
  }
  .detail-field{display:flex; flex-direction:column; font-size:.8rem;}
  .detail-field .k{color:var(--sub); font-size:.72rem;}
  .detail-field .v{font-weight:bold;}
  .detail-check-label{display:flex; align-items:center; gap:6px; font-size:.82rem;}
  #detail-memo{width:260px; min-height:44px; font-family:inherit; font-size:.8rem; padding:6px; border:1px solid var(--line); border-radius:6px; box-sizing:border-box;}
  #detail-nav{display:flex; gap:10px; margin:10px 0;}

  #detail-body-root{overflow-x:auto; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:8px;}
  table.excel-grid{border-collapse:collapse; table-layout:fixed;}
  table.excel-grid td{border:1px solid #b9b2a0; padding:0; vertical-align:middle; overflow:hidden; position:relative;}
  th.ruler-col, th.ruler-row-num, th.ruler-corner{
    background:#dcd8cc; border:1px solid #b9b2a0; font-size:.7rem; font-weight:normal; color:#5a564a;
    text-align:center; padding:2px; position:sticky; z-index:3;
  }
  th.ruler-col, th.ruler-corner{top:0;}
  th.ruler-row-num, th.ruler-corner{left:0;}
  th.ruler-corner{z-index:4;}
  td.cell-label{background:#eeeae0; padding:3px 6px; font-size:.78rem; font-weight:bold; color:#333;}
  td.cell-label span{display:block; white-space:pre-wrap; word-break:break-all;}
  td.cell-calc{background:#f2e6ce; padding:3px 20px 3px 6px; font-size:.78rem; text-align:right; color:#7a5a20;}
  td.cell-blocked{background:#f2f1ec;}
  td.cell-input{background:#fff;}
  td.cell-input input, td.cell-input textarea, td.cell-input select{
    width:100%; height:100%; border:none; padding:3px 6px; font-size:.8rem; font-family:inherit;
    background:transparent; resize:none; color:var(--ink);
  }

  #viewer-scratch-root{display:none;}
  #viewer-print-root{display:none;}
  .bulk-print-record{margin-bottom:24px;}
  .bulk-print-record h2, .bulk-print-record h3{font-size:1rem; margin:0 0 8px;}
  table.viewer-print-list-table{border-collapse:collapse; width:100%; font-size:.76rem;}
  table.viewer-print-list-table th, table.viewer-print-list-table td{border:1px solid #999; padding:4px 8px; text-align:left; vertical-align:top; white-space:pre-wrap;}
  table.viewer-print-list-table th{background:#eeeae0; font-weight:bold;}
  table.viewer-print-list-table td.viewer-print-chk{text-align:center;}

  table.print-grid{border-collapse:collapse; table-layout:fixed; width:100%;}
  table.print-grid td{
    border:1px solid #999; padding:1px 6px; vertical-align:top;
    font-size:.72rem; line-height:1.25; white-space:pre-wrap; overflow-wrap:anywhere;
    -webkit-print-color-adjust:exact; print-color-adjust:exact;
  }
  table.print-grid td.print-cell-label{background:#eeeae0; font-weight:bold;}
  table.print-grid td.print-cell-calc{text-align:right; background:#f2e6ce;}
  table.print-grid td.print-cell-blocked{background:#f2f1ec;}
  table.print-grid td.print-cell-input{background:#fff;}

  @page{margin:10mm;}
  @media print{
    .no-print{display:none !important;}
    body{background:#fff;}
    .wrap{max-width:none; padding:0; margin:0;}
    body.bulk-printing .wrap > *:not(#viewer-print-root){display:none !important;}
    body.bulk-printing #viewer-print-root{display:block;}
    .bulk-print-record{page-break-after:always;}
    .bulk-print-record:last-child{page-break-after:auto;}
  }
</style>
</head>
<body>
<div class="wrap">
  <h1 id="viewer-title" class="no-print"></h1>
  <p class="lead no-print" id="viewer-description"></p>
  <p class="viewer-meta no-print"><span id="viewer-source"></span><span id="viewer-updated"></span></p>

  <div id="list-root">
    <div id="viewer-search-bar" class="no-print">
      <input type="text" id="viewer-keyword" placeholder="キーワードで検索">
      <label id="viewer-only-checked-label" for="viewer-only-checked"><input type="checkbox" id="viewer-only-checked">気になる事業だけ表示</label>
      <label id="viewer-show-memo-label" for="viewer-show-memo"><input type="checkbox" id="viewer-show-memo">メモを表示</label>
    </div>
    <div id="viewer-col-toggle" class="no-print"></div>
    <div id="viewer-summary" class="no-print"></div>
    <div id="viewer-table-root"></div>

    <div class="action-bar no-print">
      <button class="secondary" id="btn-print-checked">🖨 表示中の事業を印刷</button>
      <button class="secondary" id="btn-export-backup">💾 ☑・メモをバックアップ（JSON）</button>
      <button class="secondary" onclick="document.getElementById('backup-file-input').click()">📂 バックアップを読み込む</button>
      <input type="file" id="backup-file-input" accept="application/json" style="display:none">
    </div>
    <p class="hint no-print">現在の検索・絞り込み結果をまとめて印刷します。☑を付けた事業だけを印刷したい場合は、「気になる事業だけ表示」で絞り込んでからこのボタンを押してください。</p>
    <p class="hint no-print">☑・メモはこの端末のブラウザにのみ保存されます（送信は行いません）。機種変更等に備えてバックアップをご利用ください。</p>
  </div>

  <div id="detail-root" style="display:none">
    <button class="secondary no-print" id="btn-back-to-list">← 一覧に戻る</button>
    <span class="hint no-print detail-back-hint">☑・メモは一覧に戻っても保持されます（この端末にのみ保存）。</span>
    <div id="detail-nav" class="no-print">
      <button class="secondary" id="detail-prev">← 前へ</button>
      <button class="secondary" id="detail-next">次へ →</button>
      <button class="secondary" id="btn-print-detail">🖨 この事業を印刷</button>
    </div>
    <div id="detail-summary-bar" class="no-print"></div>
    <div id="detail-body-root"></div>
  </div>

  <p class="ai-note no-print">このページは、市が公表した一次資料に基づき、Claude（AI）を用いて作成しています。</p>
</div>

<div id="viewer-print-root"></div>
<div id="viewer-scratch-root"></div>
